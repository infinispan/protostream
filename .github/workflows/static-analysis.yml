name: 'Static Analysis'

on:
  pull_request:
    branches: ['main']
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'CODEOWNERS'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: 'SpotBugs and PMD CPD'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Setup Java'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 'Run SpotBugs and PMD CPD'
        # advisory only: findings land in the uploaded reports, the build does not fail
        run: ./mvnw -B -ntp -Pstatic-analysis verify -DskipTests -Dcheckstyle.skip

      - name: 'Upload reports'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-reports
          path: |
            **/target/spotbugsXml.xml
            **/target/cpd.xml
          retention-days: 14
